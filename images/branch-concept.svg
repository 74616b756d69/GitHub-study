<svg viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Hiragino Sans', sans-serif">
  <defs>
    <filter id="shadow3" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="800" height="380" rx="16" fill="#f6f8fa"/>
  <text x="400" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#24292e">ブランチ（Branch）のイメージ</text>

  <!-- Main branch line (draws left to right) -->
  <line x1="80" y1="180" x2="720" y2="180" stroke="#1a7f37" stroke-width="4" stroke-linecap="round"
        pathLength="100" stroke-dasharray="100">
    <animate attributeName="stroke-dashoffset" values="100;100;0;0" keyTimes="0;0.02;0.72;1" dur="9s" repeatCount="indefinite"/>
  </line>
  <text x="60" y="215" font-size="14" font-weight="bold" fill="#1a7f37">main</text>
  <text x="60" y="232" font-size="10" fill="#57606a">（本番）</text>

  <!-- C1 -->
  <circle cx="140" cy="180" r="0" fill="#1a7f37" filter="url(#shadow3)">
    <animate attributeName="r" values="0;0;17;14;14" keyTimes="0;0.06;0.08;0.10;1" dur="9s" repeatCount="indefinite"/>
  </circle>
  <text x="140" y="185" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff" opacity="0">C1
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.06;0.09;1" dur="9s" repeatCount="indefinite"/>
  </text>

  <!-- C3 -->
  <circle cx="380" cy="180" r="0" fill="#1a7f37" filter="url(#shadow3)">
    <animate attributeName="r" values="0;0;17;14;14" keyTimes="0;0.32;0.34;0.36;1" dur="9s" repeatCount="indefinite"/>
  </circle>
  <text x="380" y="185" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff" opacity="0">C3
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.32;0.35;1" dur="9s" repeatCount="indefinite"/>
  </text>

  <!-- Feature branch: split curve -->
  <path d="M 260 180 C 300 180, 310 100, 350 100" stroke="#8250df" stroke-width="3" fill="none" stroke-linecap="round"
        pathLength="100" stroke-dasharray="100">
    <animate attributeName="stroke-dashoffset" values="100;100;0;0" keyTimes="0;0.20;0.26;1" dur="9s" repeatCount="indefinite"/>
  </path>

  <!-- C2 (branch point, drawn above the purple curve so it isn't covered) -->
  <circle cx="260" cy="180" r="0" fill="#1a7f37" filter="url(#shadow3)">
    <animate attributeName="r" values="0;0;17;14;14" keyTimes="0;0.16;0.18;0.20;1" dur="9s" repeatCount="indefinite"/>
  </circle>
  <text x="260" y="185" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff" opacity="0">C2
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.16;0.19;1" dur="9s" repeatCount="indefinite"/>
  </text>
  <!-- Feature branch: straight run -->
  <line x1="350" y1="100" x2="550" y2="100" stroke="#8250df" stroke-width="3" stroke-linecap="round"
        pathLength="100" stroke-dasharray="100">
    <animate attributeName="stroke-dashoffset" values="100;100;0;0" keyTimes="0;0.26;0.40;1" dur="9s" repeatCount="indefinite"/>
  </line>
  <!-- Feature branch: merge curve -->
  <path d="M 550 100 C 590 100, 600 180, 620 180" stroke="#8250df" stroke-width="3" fill="none" stroke-linecap="round"
        pathLength="100" stroke-dasharray="100">
    <animate attributeName="stroke-dashoffset" values="100;100;0;0" keyTimes="0;0.58;0.66;1" dur="9s" repeatCount="indefinite"/>
  </path>

  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.24;0.30;1" dur="9s" repeatCount="indefinite"/>
    <text x="350" y="72" font-size="14" font-weight="bold" fill="#8250df">feature/add-profile</text>
    <text x="350" y="88" font-size="10" fill="#6e40c9">（新機能の作業用）</text>
  </g>

  <!-- C4 -->
  <circle cx="400" cy="100" r="0" fill="#8250df" filter="url(#shadow3)">
    <animate attributeName="r" values="0;0;17;14;14" keyTimes="0;0.38;0.40;0.42;1" dur="9s" repeatCount="indefinite"/>
  </circle>
  <text x="400" y="105" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff" opacity="0">C4
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.38;0.41;1" dur="9s" repeatCount="indefinite"/>
  </text>

  <!-- C5 -->
  <circle cx="500" cy="100" r="0" fill="#8250df" filter="url(#shadow3)">
    <animate attributeName="r" values="0;0;17;14;14" keyTimes="0;0.50;0.52;0.54;1" dur="9s" repeatCount="indefinite"/>
  </circle>
  <text x="500" y="105" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff" opacity="0">C5
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.50;0.53;1" dur="9s" repeatCount="indefinite"/>
  </text>

  <!-- C6 (merge commit) -->
  <circle cx="620" cy="180" r="0" fill="#1a7f37" filter="url(#shadow3)">
    <animate attributeName="r" values="0;0;18;14;14" keyTimes="0;0.68;0.71;0.74;1" dur="9s" repeatCount="indefinite"/>
  </circle>
  <text x="620" y="185" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff" opacity="0">C6
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.68;0.72;1" dur="9s" repeatCount="indefinite"/>
  </text>

  <!-- Merge ring pulse -->
  <circle cx="620" cy="180" r="20" fill="none" stroke="#1a7f37" stroke-width="2" stroke-dasharray="4,2" opacity="0">
    <animate attributeName="opacity" values="0;0;1;0.55;1;1" keyTimes="0;0.72;0.76;0.84;0.92;1" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="r" values="20;20;26;20;20" keyTimes="0;0.72;0.78;0.84;1" dur="9s" repeatCount="indefinite"/>
  </circle>

  <!-- Branch point annotation -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.20;0.26;1" dur="9s" repeatCount="indefinite"/>
    <line x1="260" y1="155" x2="260" y2="135" stroke="#6e7781" stroke-width="1" stroke-dasharray="3,2"/>
    <rect x="195" y="116" width="130" height="22" rx="6" fill="#fff3cd"/>
    <text x="260" y="132" text-anchor="middle" font-size="10" fill="#664d03">ここでブランチ作成</text>
  </g>

  <!-- Merge point annotation -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.64;0.70;1" dur="9s" repeatCount="indefinite"/>
    <line x1="620" y1="155" x2="620" y2="135" stroke="#6e7781" stroke-width="1" stroke-dasharray="3,2"/>
    <rect x="570" y="116" width="100" height="22" rx="6" fill="#d1e7dd"/>
    <text x="620" y="132" text-anchor="middle" font-size="10" fill="#0f5132">マージ（統合）</text>
  </g>

  <!-- Bottom explanation -->
  <rect x="60" y="260" width="680" height="100" rx="12" fill="#fff" stroke="#d0d7de" stroke-width="1"/>
  <text x="400" y="287" text-anchor="middle" font-size="14" font-weight="bold" fill="#24292e">ブランチを使うメリット</text>
  <text x="100" y="312" font-size="12" fill="#24292e">1. main ブランチを壊さずに新しい機能を開発できる</text>
  <text x="100" y="332" font-size="12" fill="#24292e">2. 複数人が同時に別々の機能を開発できる</text>
  <text x="100" y="352" font-size="12" fill="#24292e">3. 完成したらマージして main に反映する</text>
</svg>
