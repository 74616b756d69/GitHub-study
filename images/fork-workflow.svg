<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Hiragino Sans', sans-serif">
  <defs>
    <filter id="shadow2" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6e7781"/>
    </marker>
    <marker id="arrPurple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8250df"/>
    </marker>
    <marker id="arrBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0969da"/>
    </marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1a7f37"/>
    </marker>
  </defs>

  <rect width="800" height="500" rx="16" fill="#f6f8fa"/>
  <text x="400" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#24292e">Fork ワークフロー</text>

  <!-- Step 1: Fork -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.06;1" dur="12s" repeatCount="indefinite"/>
    <circle cx="60" cy="120" r="22" fill="#8250df"/>
    <text x="60" y="127" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">1</text>
    <text x="95" y="127" font-size="14" font-weight="bold" fill="#8250df">Fork（フォーク）</text>
    <rect x="250" y="80" width="200" height="70" rx="12" fill="#fff" stroke="#d0d7de" stroke-width="2" filter="url(#shadow2)"/>
    <text x="350" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#24292e">元のリポジトリ</text>
    <text x="350" y="130" text-anchor="middle" font-size="11" fill="#57606a">Akasan-T/GitHub-Studie</text>
  </g>

  <!-- Fork Arrow -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.12;0.17;1" dur="12s" repeatCount="indefinite"/>
    <path d="M 450 115 C 500 115, 500 115, 550 115" stroke="#8250df" stroke-width="2.5" fill="none" marker-end="url(#arrPurple)" stroke-dasharray="6,3">
      <animate attributeName="stroke-dashoffset" values="0;-18" dur="1s" repeatCount="indefinite"/>
    </path>
    <text x="500" y="105" text-anchor="middle" font-size="11" font-weight="bold" fill="#8250df">Fork!</text>
  </g>

  <!-- Your Fork -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.19;0.24;1" dur="12s" repeatCount="indefinite"/>
    <rect x="550" y="80" width="200" height="70" rx="12" fill="#f3e8ff" stroke="#8250df" stroke-width="2" filter="url(#shadow2)"/>
    <text x="650" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#8250df">あなたのフォーク</text>
    <text x="650" y="130" text-anchor="middle" font-size="11" fill="#6e40c9">あなた/GitHub-Studie</text>
  </g>

  <!-- Step 2: Clone -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.28;0.33;1" dur="12s" repeatCount="indefinite"/>
    <circle cx="60" cy="230" r="22" fill="#0969da"/>
    <text x="60" y="237" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">2</text>
    <text x="95" y="237" font-size="14" font-weight="bold" fill="#0969da">Clone（クローン）</text>
  </g>

  <!-- Clone Arrow -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.32;0.37;1" dur="12s" repeatCount="indefinite"/>
    <path d="M 650 150 L 650 200 C 650 220, 400 220, 400 240" stroke="#0969da" stroke-width="2.5" fill="none" marker-end="url(#arrBlue)" stroke-dasharray="6,3">
      <animate attributeName="stroke-dashoffset" values="0;-18" dur="1s" repeatCount="indefinite"/>
    </path>
    <text x="560" y="210" font-size="11" font-weight="bold" fill="#0969da">git clone</text>
  </g>

  <!-- Local PC -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.40;0.45;1" dur="12s" repeatCount="indefinite"/>
    <rect x="250" y="240" width="300" height="90" rx="12" fill="#ddf4ff" stroke="#0969da" stroke-width="2" filter="url(#shadow2)"/>
    <text x="400" y="268" text-anchor="middle" font-size="13" font-weight="bold" fill="#0969da">あなたのパソコン</text>
    <text x="400" y="290" text-anchor="middle" font-size="11" fill="#0550ae">ここでコードを編集する</text>
    <text x="400" y="310" text-anchor="middle" font-size="11" fill="#0550ae">git add / git commit</text>
    <rect x="190" y="245" width="60" height="20" rx="6" fill="#fff"/>
    <text x="220" y="259" text-anchor="middle" font-size="9" fill="#0969da">ローカル</text>
  </g>

  <!-- Step 3: Push -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.52;0.57;1" dur="12s" repeatCount="indefinite"/>
    <circle cx="60" cy="380" r="22" fill="#1a7f37"/>
    <text x="60" y="387" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">3</text>
    <text x="95" y="387" font-size="14" font-weight="bold" fill="#1a7f37">Push &amp; Pull Request</text>
  </g>

  <!-- Push Arrow -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.56;0.61;1" dur="12s" repeatCount="indefinite"/>
    <path d="M 550 300 C 700 300, 700 350, 650 370" stroke="#1a7f37" stroke-width="2.5" fill="none" marker-end="url(#arrGreen)" stroke-dasharray="6,3">
      <animate attributeName="stroke-dashoffset" values="0;-18" dur="1s" repeatCount="indefinite"/>
    </path>
    <text x="680" y="340" font-size="11" font-weight="bold" fill="#1a7f37">git push</text>
  </g>

  <!-- Your Fork (bottom) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.63;0.68;1" dur="12s" repeatCount="indefinite"/>
    <rect x="550" y="370" width="200" height="50" rx="12" fill="#f3e8ff" stroke="#8250df" stroke-width="2" filter="url(#shadow2)"/>
    <text x="650" y="400" text-anchor="middle" font-size="12" font-weight="bold" fill="#8250df">あなたのフォーク</text>
  </g>

  <!-- PR Arrow -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.72;0.77;1" dur="12s" repeatCount="indefinite"/>
    <path d="M 550 395 C 500 395, 480 395, 450 395" stroke="#1a7f37" stroke-width="2.5" fill="none" marker-end="url(#arrGreen)" stroke-dasharray="6,3">
      <animate attributeName="stroke-dashoffset" values="0;-18" dur="1s" repeatCount="indefinite"/>
    </path>
    <text x="500" y="385" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a7f37">Pull Request!</text>
  </g>

  <!-- Original Repo (bottom) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.80;0.85;1" dur="12s" repeatCount="indefinite"/>
    <rect x="250" y="370" width="200" height="50" rx="12" fill="#d1e7dd" stroke="#1a7f37" stroke-width="2" filter="url(#shadow2)">
      <animate attributeName="stroke-width" values="2;5;2;4;2;2" keyTimes="0;0.87;0.90;0.93;0.96;1" dur="12s" repeatCount="indefinite"/>
    </rect>
    <text x="350" y="400" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a7f37">元のリポジトリに反映</text>
  </g>

  <!-- Cloud label -->
  <rect x="700" y="60" width="80" height="24" rx="8" fill="#e8e8e8"/>
  <text x="740" y="77" text-anchor="middle" font-size="10" fill="#57606a">GitHub上</text>

  <!-- Summary -->
  <text x="400" y="470" text-anchor="middle" font-size="13" fill="#57606a">Fork = 自分専用のコピーを作る / Clone = PCにダウンロード / PR = 変更を提案する</text>
</svg>
