<svg viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Hiragino Sans', sans-serif">
  <defs>
    <filter id="fcShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.14"/>
    </filter>
    <marker id="fcArr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0 0, 9 4.5, 0 9" fill="#e16f24"/>
    </marker>
  </defs>

  <rect width="800" height="460" rx="16" fill="#f6f8fa"/>
  <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#24292e">GitHub のリポジトリ画面（Fork と Clone）</text>

  <!-- Browser window -->
  <rect x="40" y="58" width="720" height="384" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" filter="url(#fcShadow)"/>
  <!-- title bar -->
  <rect x="40" y="58" width="720" height="30" rx="10" fill="#eaeef2"/>
  <rect x="40" y="76" width="720" height="12" fill="#eaeef2"/>
  <circle cx="60" cy="73" r="5" fill="#ff5f57"/>
  <circle cx="78" cy="73" r="5" fill="#febc2e"/>
  <circle cx="96" cy="73" r="5" fill="#28c840"/>
  <rect x="120" y="65" width="500" height="16" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="132" y="77" font-size="10" fill="#57606a">github.com / your-name / GitHub-Studie</text>

  <!-- repo header row -->
  <text x="66" y="120" font-size="15" font-weight="bold" fill="#0969da">your-name / GitHub-Studie</text>
  <rect x="66" y="130" width="52" height="18" rx="9" fill="#ffffff" stroke="#d0d7de"/>
  <text x="92" y="143" text-anchor="middle" font-size="10" fill="#57606a">Public</text>

  <!-- Watch / Fork / Star buttons (top right) -->
  <rect x="470" y="108" width="80" height="26" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="510" y="125" text-anchor="middle" font-size="11" fill="#24292e">👁 Watch</text>

  <rect x="558" y="108" width="78" height="26" rx="6" fill="#ddf4ff" stroke="#54aeff" stroke-width="2">
    <animate attributeName="stroke-width" values="2;4.5;2;2" keyTimes="0;0.1;0.28;1" dur="8s" repeatCount="indefinite"/>
  </rect>
  <text x="597" y="125" text-anchor="middle" font-size="11" font-weight="bold" fill="#0969da">⑂ Fork</text>

  <rect x="644" y="108" width="72" height="26" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="680" y="125" text-anchor="middle" font-size="11" fill="#24292e">★ Star</text>

  <!-- Fork callout -->
  <line x1="597" y1="98" x2="597" y2="106" stroke="#e16f24" stroke-width="2" marker-end="url(#fcArr)"/>
  <text x="597" y="94" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#e16f24">①自分のアカウントにコピー</text>

  <!-- toolbar: branch + Code button -->
  <rect x="66" y="164" width="90" height="30" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="111" y="183" text-anchor="middle" font-size="11" fill="#24292e">⑃ main ▾</text>

  <rect x="600" y="164" width="116" height="30" rx="6" fill="#1f883d">
    <animate attributeName="opacity" values="1;1;0.4;1;0.4;1;1" keyTimes="0;0.36;0.40;0.44;0.48;0.52;1" dur="8s" repeatCount="indefinite"/>
  </rect>
  <text x="646" y="183" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">&lt;&gt; Code ▾</text>

  <!-- Code callout -->
  <text x="658" y="158" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#e16f24">②緑の Code をクリック</text>

  <!-- file list (muted) -->
  <rect x="66" y="204" width="650" height="26" rx="6" fill="#f6f8fa" stroke="#d8dee4"/>
  <text x="80" y="221" font-size="11" fill="#57606a">📁 docs</text>
  <rect x="66" y="204" width="650" height="26" fill="none"/>
  <line x1="66" y1="230" x2="716" y2="230" stroke="#eaeef2"/>
  <text x="80" y="248" font-size="11" fill="#8b949e">📁 exercises</text>
  <text x="80" y="270" font-size="11" fill="#8b949e">📄 README.md</text>

  <!-- Code dropdown panel -->
  <rect x="452" y="200" width="264" height="150" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" filter="url(#fcShadow)"/>
  <text x="466" y="222" font-size="11" font-weight="bold" fill="#24292e">Clone</text>
  <!-- tabs -->
  <rect x="466" y="230" width="52" height="22" rx="6" fill="#0969da"/>
  <text x="492" y="245" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">HTTPS</text>
  <text x="540" y="245" text-anchor="middle" font-size="10" fill="#57606a">SSH</text>
  <text x="590" y="245" text-anchor="middle" font-size="10" fill="#57606a">GitHub CLI</text>
  <!-- url box -->
  <rect x="466" y="260" width="236" height="26" rx="6" fill="#f6f8fa" stroke="#d0d7de">
    <animate attributeName="stroke" values="#d0d7de;#d0d7de;#e16f24;#d0d7de;#d0d7de" keyTimes="0;0.62;0.70;0.84;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="1;1;3;1;1" keyTimes="0;0.62;0.70;0.84;1" dur="8s" repeatCount="indefinite"/>
  </rect>
  <text x="474" y="277" font-size="9.5" fill="#24292e">https://github.com/your-name/GitHub-Studie.git</text>
  <rect x="680" y="264" width="18" height="18" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="689" y="277" text-anchor="middle" font-size="10" fill="#57606a">⧉</text>
  <line x1="466" y1="298" x2="702" y2="298" stroke="#eaeef2"/>
  <text x="474" y="316" font-size="10.5" fill="#24292e">📥 Open with GitHub Desktop</text>
  <text x="474" y="338" font-size="10.5" fill="#24292e">🗜 Download ZIP</text>

  <!-- Clone callout -->
  <text x="584" y="372" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#e16f24">③この URL をコピーして git clone</text>
</svg>
