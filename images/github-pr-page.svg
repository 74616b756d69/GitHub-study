<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Hiragino Sans', sans-serif">
  <defs>
    <filter id="prShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.14"/>
    </filter>
    <marker id="prArr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0 0, 9 4.5, 0 9" fill="#e16f24"/>
    </marker>
  </defs>

  <rect width="800" height="480" rx="16" fill="#f6f8fa"/>
  <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#24292e">Pull Request の画面の見方</text>

  <!-- Browser window -->
  <rect x="30" y="52" width="740" height="410" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" filter="url(#prShadow)"/>
  <rect x="30" y="52" width="740" height="30" rx="10" fill="#eaeef2"/>
  <rect x="30" y="70" width="740" height="12" fill="#eaeef2"/>
  <circle cx="50" cy="67" r="5" fill="#ff5f57"/>
  <circle cx="68" cy="67" r="5" fill="#febc2e"/>
  <circle cx="86" cy="67" r="5" fill="#28c840"/>

  <!-- PR title -->
  <text x="50" y="110" font-size="15" font-weight="bold" fill="#24292e">自己紹介カードを追加 <tspan fill="#8b949e" font-weight="normal">#3</tspan></text>
  <!-- Open badge -->
  <rect x="50" y="120" width="66" height="24" rx="12" fill="#1f883d"/>
  <text x="83" y="136" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">⑃ Open</text>
  <text x="124" y="137" font-size="10.5" fill="#57606a">your-name が main への 1 件のコミットをマージしようとしています</text>

  <line x1="50" y1="156" x2="750" y2="156" stroke="#d0d7de"/>

  <!-- Tabs -->
  <text x="55" y="176" font-size="11" font-weight="bold" fill="#24292e">💬 Conversation</text>
  <text x="165" y="176" font-size="11" fill="#57606a">✔ Commits 1</text>
  <text x="255" y="176" font-size="11" fill="#57606a">⧉ Files changed 1</text>
  <line x1="50" y1="184" x2="160" y2="184" stroke="#fd8c73" stroke-width="2.5"/>

  <!-- LEFT: conversation area -->
  <rect x="50" y="196" width="440" height="80" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <circle cx="72" cy="216" r="9" fill="#54aeff"/>
  <text x="90" y="213" font-size="10.5" font-weight="bold" fill="#24292e">your-name</text>
  <text x="152" y="213" font-size="9.5" fill="#8b949e">たった今</text>
  <text x="66" y="238" font-size="10" fill="#57606a">自己紹介カードを追加しました。</text>
  <text x="66" y="255" font-size="10" fill="#57606a">レビューよろしくお願いします 🙏</text>

  <!-- review/merge box -->
  <rect x="50" y="290" width="440" height="120" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <circle cx="70" cy="312" r="9" fill="#1f883d"/>
  <text x="70" y="316" text-anchor="middle" font-size="11" fill="#fff">✔</text>
  <text x="88" y="309" font-size="11" font-weight="bold" fill="#1a7f37">レビュアーが承認しました（Approve）</text>
  <text x="88" y="325" font-size="9.5" fill="#57606a">1 名が変更を承認しています</text>
  <line x1="66" y1="340" x2="474" y2="340" stroke="#eaeef2"/>
  <circle cx="70" cy="362" r="9" fill="#1f883d"/>
  <text x="70" y="366" text-anchor="middle" font-size="10" fill="#fff">✓</text>
  <text x="88" y="359" font-size="11" font-weight="bold" fill="#24292e">コンフリクトはありません</text>
  <text x="88" y="374" font-size="9.5" fill="#57606a">このブランチは main に自動でマージできます</text>
  <rect x="88" y="384" width="150" height="24" rx="6" fill="#1f883d"/>
  <text x="163" y="400" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Merge pull request</text>

  <!-- merge callout -->
  <line x1="255" y1="424" x2="200" y2="410" stroke="#e16f24" stroke-width="2" marker-end="url(#prArr)"/>
  <text x="360" y="430" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#e16f24">承認されたらこのボタンで main に統合</text>

  <!-- RIGHT sidebar -->
  <line x1="510" y1="196" x2="510" y2="420" stroke="#eaeef2"/>
  <text x="524" y="210" font-size="10.5" font-weight="bold" fill="#24292e">Reviewers</text>
  <text x="524" y="226" font-size="9.5" fill="#57606a">レビューを依頼する人</text>
  <line x1="524" y1="236" x2="748" y2="236" stroke="#eaeef2"/>

  <text x="524" y="256" font-size="10.5" font-weight="bold" fill="#24292e">Assignees</text>
  <text x="524" y="272" font-size="9.5" fill="#57606a">この PR の担当者</text>
  <line x1="524" y1="282" x2="748" y2="282" stroke="#eaeef2"/>

  <text x="524" y="302" font-size="10.5" font-weight="bold" fill="#24292e">Labels</text>
  <rect x="524" y="310" width="70" height="18" rx="9" fill="#ddf4ff"/>
  <text x="559" y="323" text-anchor="middle" font-size="9" fill="#0969da">enhancement</text>
  <line x1="524" y1="340" x2="748" y2="340" stroke="#eaeef2"/>

  <text x="524" y="360" font-size="10.5" font-weight="bold" fill="#24292e">Milestone / Projects</text>
  <text x="524" y="376" font-size="9.5" fill="#57606a">進捗管理に使う項目</text>

  <!-- sidebar callout -->
  <text x="636" y="404" text-anchor="middle" font-size="10" font-weight="bold" fill="#e16f24">右側 = 「誰が・何の」を</text>
  <text x="636" y="418" text-anchor="middle" font-size="10" font-weight="bold" fill="#e16f24">整理する補助項目</text>
</svg>
