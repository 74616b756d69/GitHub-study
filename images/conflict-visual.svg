<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Hiragino Sans', sans-serif">
  <defs>
    <filter id="shCf" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
    <marker id="arrCf" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6e7781"/>
    </marker>
  </defs>

  <rect width="800" height="500" rx="16" fill="#f6f8fa"/>
  <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#24292e">コンフリクト（衝突）はなぜ起きる？</text>

  <!-- Base file -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.06;1" dur="10s" repeatCount="indefinite"/>
    <rect x="280" y="60" width="240" height="70" rx="10" fill="#fff" stroke="#d0d7de" stroke-width="1.5" filter="url(#shCf)"/>
    <text x="400" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#24292e">元のファイル（main）</text>
    <rect x="300" y="96" width="200" height="22" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
    <text x="400" y="112" text-anchor="middle" font-size="11" fill="#24292e">好きな言語: Python</text>
  </g>

  <!-- Branch arrows (draw outward) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.16;0.18;1" dur="10s" repeatCount="indefinite"/>
    <line x1="340" y1="130" x2="180" y2="165" stroke="#0969da" stroke-width="2" marker-end="url(#arrCf)"/>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.20;0.22;1" dur="10s" repeatCount="indefinite"/>
    <line x1="460" y1="130" x2="620" y2="165" stroke="#8250df" stroke-width="2" marker-end="url(#arrCf)"/>
  </g>

  <!-- Person A edits -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.18;0.24;1" dur="10s" repeatCount="indefinite"/>
    <rect x="60" y="170" width="240" height="120" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="2" filter="url(#shCf)"/>
    <circle cx="90" cy="195" r="14" fill="#0969da"/>
    <text x="90" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">A</text>
    <text x="200" y="198" text-anchor="middle" font-size="12" font-weight="bold" fill="#0969da">Aさんの変更</text>
    <rect x="80" y="215" width="200" height="22" rx="4" fill="#fff" stroke="#0969da" stroke-width="1"/>
    <text x="180" y="231" text-anchor="middle" font-size="11" fill="#0969da">好きな言語: JavaScript</text>
    <text x="180" y="268" text-anchor="middle" font-size="10" fill="#57606a">Python → JavaScript に変更</text>
  </g>

  <!-- Person B edits -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.22;0.28;1" dur="10s" repeatCount="indefinite"/>
    <rect x="500" y="170" width="240" height="120" rx="10" fill="#f3e8ff" stroke="#8250df" stroke-width="2" filter="url(#shCf)"/>
    <circle cx="530" cy="195" r="14" fill="#8250df"/>
    <text x="530" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">B</text>
    <text x="640" y="198" text-anchor="middle" font-size="12" font-weight="bold" fill="#8250df">Bさんの変更</text>
    <rect x="520" y="215" width="200" height="22" rx="4" fill="#fff" stroke="#8250df" stroke-width="1"/>
    <text x="620" y="231" text-anchor="middle" font-size="11" fill="#8250df">好きな言語: TypeScript</text>
    <text x="620" y="268" text-anchor="middle" font-size="10" fill="#57606a">Python → TypeScript に変更</text>
  </g>

  <!-- Merge arrows (both rush toward the center) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.44;0.48;1" dur="10s" repeatCount="indefinite"/>
    <line x1="180" y1="290" x2="340" y2="325" stroke="#cf222e" stroke-width="2" marker-end="url(#arrCf)"/>
    <line x1="620" y1="290" x2="460" y2="325" stroke="#cf222e" stroke-width="2" marker-end="url(#arrCf)"/>
  </g>

  <!-- Conflict! (flashes on impact) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.50;0.53;1" dur="10s" repeatCount="indefinite"/>
    <rect x="260" y="315" width="280" height="70" rx="10" fill="#ffebe9" stroke="#cf222e" stroke-width="2.5" filter="url(#shCf)">
      <animate attributeName="stroke-width" values="2.5;7;2.5;5;2.5;2.5" keyTimes="0;0.03;0.08;0.12;0.18;1" dur="10s" repeatCount="indefinite"/>
    </rect>
    <text x="400" y="342" text-anchor="middle" font-size="16" font-weight="bold" fill="#cf222e">CONFLICT（衝突）!</text>
    <text x="400" y="365" text-anchor="middle" font-size="11" fill="#cf222e">同じ行を2人が違う内容に変更した</text>
    <text x="400" y="380" text-anchor="middle" font-size="11" fill="#cf222e">→ Git はどちらを採用すべきか判断できない</text>
  </g>

  <!-- Resolution -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.68;0.72;1" dur="10s" repeatCount="indefinite"/>
    <line x1="400" y1="385" x2="400" y2="410" stroke="#6e7781" stroke-width="2" marker-end="url(#arrCf)"/>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.72;0.78;1" dur="10s" repeatCount="indefinite"/>
    <rect x="220" y="415" width="360" height="70" rx="10" fill="#d1e7dd" stroke="#1a7f37" stroke-width="2" filter="url(#shCf)"/>
    <text x="400" y="440" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a7f37">手動で解決する</text>
    <text x="400" y="462" text-anchor="middle" font-size="11" fill="#0f5132">どちらを残すか（または両方残すか）自分で決めて、</text>
    <text x="400" y="478" text-anchor="middle" font-size="11" fill="#0f5132">コンフリクトマーカー（&lt;&lt;&lt;&lt;&lt; ===== &gt;&gt;&gt;&gt;&gt;）を削除する</text>
  </g>
</svg>
