<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Hiragino Sans', sans-serif">
  <defs>
    <filter id="shadow5" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="800" height="480" rx="16" fill="#f6f8fa"/>
  <text x="400" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#24292e">Pull Request（プルリクエスト）の流れ</text>

  <!-- Step 1 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.08;1" dur="10s" repeatCount="indefinite"/>
    <rect x="250" y="65" width="300" height="60" rx="14" fill="#ddf4ff" stroke="#0969da" stroke-width="2" filter="url(#shadow5)"/>
    <circle cx="280" cy="95" r="16" fill="#0969da"/>
    <text x="280" y="101" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">1</text>
    <text x="410" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#0969da">ブランチで作業 &amp; Push</text>
    <text x="410" y="112" text-anchor="middle" font-size="11" fill="#0550ae">変更を GitHub にアップロード</text>
  </g>

  <!-- Arrow 1→2 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.14;0.18;1" dur="10s" repeatCount="indefinite"/>
    <line x1="400" y1="125" x2="400" y2="148" stroke="#0969da" stroke-width="2.5"/>
  </g>

  <!-- Step 2 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.19;0.25;1" dur="10s" repeatCount="indefinite"/>
    <rect x="250" y="155" width="300" height="60" rx="14" fill="#f3e8ff" stroke="#8250df" stroke-width="2" filter="url(#shadow5)"/>
    <circle cx="280" cy="185" r="16" fill="#8250df"/>
    <text x="280" y="191" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">2</text>
    <text x="410" y="182" text-anchor="middle" font-size="14" font-weight="bold" fill="#8250df">Pull Request を作成</text>
    <text x="410" y="202" text-anchor="middle" font-size="11" fill="#6e40c9">「この変更をレビューしてください！」</text>
  </g>

  <!-- Arrow 2→3 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.29;0.33;1" dur="10s" repeatCount="indefinite"/>
    <line x1="400" y1="215" x2="400" y2="238" stroke="#0969da" stroke-width="2.5"/>
  </g>

  <!-- Step 3 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.34;0.40;1" dur="10s" repeatCount="indefinite"/>
    <rect x="250" y="245" width="300" height="60" rx="14" fill="#fff3cd" stroke="#f0ad4e" stroke-width="2" filter="url(#shadow5)"/>
    <circle cx="280" cy="275" r="16" fill="#f0ad4e"/>
    <text x="280" y="281" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">3</text>
    <text x="410" y="272" text-anchor="middle" font-size="14" font-weight="bold" fill="#664d03">コードレビュー</text>
    <text x="410" y="292" text-anchor="middle" font-size="11" fill="#664d03">チームメンバーがコードを確認</text>
  </g>

  <!-- Feedback loop (dashes keep marching) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.42;0.48;1" dur="10s" repeatCount="indefinite"/>
    <path d="M 550 270 C 620 270, 620 200, 550 200" stroke="#e16f24" stroke-width="2" fill="none" stroke-dasharray="5,3">
      <animate attributeName="stroke-dashoffset" values="0;-16" dur="0.9s" repeatCount="indefinite"/>
    </path>
    <text x="610" y="240" font-size="10" fill="#e16f24">修正依頼</text>
    <text x="610" y="254" font-size="10" fill="#e16f24">→ 再修正</text>
  </g>

  <!-- Arrow 3→4 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.54;0.58;1" dur="10s" repeatCount="indefinite"/>
    <line x1="400" y1="305" x2="400" y2="328" stroke="#0969da" stroke-width="2.5"/>
  </g>

  <!-- Step 4 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.59;0.65;1" dur="10s" repeatCount="indefinite"/>
    <rect x="250" y="335" width="300" height="60" rx="14" fill="#d1e7dd" stroke="#1a7f37" stroke-width="2" filter="url(#shadow5)"/>
    <circle cx="280" cy="365" r="16" fill="#1a7f37"/>
    <text x="280" y="371" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">4</text>
    <text x="410" y="357" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a7f37">Approve &amp; Merge</text>
    <text x="410" y="380" text-anchor="middle" font-size="11" fill="#0f5132">承認されたら main に統合！</text>
  </g>

  <!-- Arrow 4→Success -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.7;0.74;1" dur="10s" repeatCount="indefinite"/>
    <line x1="400" y1="395" x2="400" y2="418" stroke="#1a7f37" stroke-width="2.5"/>
  </g>

  <!-- Success pill -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.75;0.80;1" dur="10s" repeatCount="indefinite"/>
    <rect x="300" y="420" width="200" height="40" rx="20" fill="#1a7f37" filter="url(#shadow5)">
      <animate attributeName="opacity" values="1;0.6;1;0.75;1;1" keyTimes="0;0.82;0.86;0.90;0.94;1" dur="10s" repeatCount="indefinite"/>
    </rect>
    <text x="400" y="445" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">main に反映完了！</text>
  </g>

  <!-- Side annotation -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.20;0.27;1" dur="10s" repeatCount="indefinite"/>
    <rect x="30" y="155" width="190" height="80" rx="10" fill="#fff" stroke="#d0d7de" stroke-width="1"/>
    <text x="125" y="178" text-anchor="middle" font-size="11" font-weight="bold" fill="#24292e">PR に書くこと</text>
    <text x="45" y="196" font-size="10" fill="#57606a">- 何を変更したか</text>
    <text x="45" y="212" font-size="10" fill="#57606a">- なぜ変更したか</text>
    <text x="45" y="228" font-size="10" fill="#57606a">- 動作確認の方法</text>
  </g>
</svg>
