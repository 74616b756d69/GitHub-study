<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Hiragino Sans', sans-serif">
  <defs>
    <filter id="afShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
    <marker id="afArr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0969da"/>
    </marker>
  </defs>

  <rect width="800" height="400" rx="16" fill="#f6f8fa"/>
  <text x="400" y="38" text-anchor="middle" font-size="21" font-weight="bold" fill="#24292e">Git の基本操作フロー（動く版）</text>
  <text x="400" y="58" text-anchor="middle" font-size="11.5" fill="#57606a">変更が「編集 → add → commit → push」と流れていく様子</text>

  <!-- ===== Working Directory ===== -->
  <rect x="30" y="96" width="150" height="130" rx="14" fill="#fff3cd" stroke="#f0ad4e" stroke-width="2" filter="url(#afShadow)"/>
  <text x="105" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#664d03">作業ディレクトリ</text>
  <text x="105" y="148" text-anchor="middle" font-size="10.5" fill="#664d03">Working Directory</text>
  <rect x="50" y="162" width="110" height="24" rx="6" fill="#fff"/>
  <text x="105" y="179" text-anchor="middle" font-size="10" fill="#664d03">ファイルを編集</text>
  <rect x="50" y="192" width="110" height="24" rx="6" fill="#fff"/>
  <text x="105" y="209" text-anchor="middle" font-size="10" fill="#664d03">コードを書く</text>
  <rect x="30" y="96" width="150" height="130" rx="14" fill="none" stroke="#e16f24" stroke-width="4" opacity="0">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.12;0.17;0.97;1" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- arrow + git add -->
  <line x1="180" y1="161" x2="230" y2="161" stroke="#0969da" stroke-width="3" marker-end="url(#afArr)"/>
  <rect x="178" y="122" width="60" height="26" rx="8" fill="#ddf4ff" stroke="#0969da"/>
  <text x="208" y="140" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0969da">git add</text>
  <rect x="178" y="122" width="60" height="26" rx="8" fill="#0969da" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.125;0.14;0.25;0.29;1" dur="8s" repeatCount="indefinite"/>
  </rect>
  <text x="208" y="140" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#fff" opacity="0">git add
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.125;0.14;0.25;0.29;1" dur="8s" repeatCount="indefinite"/>
  </text>

  <!-- ===== Staging ===== -->
  <rect x="240" y="96" width="150" height="130" rx="14" fill="#cff4fc" stroke="#0dcaf0" stroke-width="2" filter="url(#afShadow)"/>
  <text x="315" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#055160">ステージング</text>
  <text x="315" y="148" text-anchor="middle" font-size="10.5" fill="#055160">Staging Area</text>
  <rect x="260" y="162" width="110" height="24" rx="6" fill="#fff"/>
  <text x="315" y="179" text-anchor="middle" font-size="10" fill="#055160">変更を選択</text>
  <rect x="260" y="192" width="110" height="24" rx="6" fill="#fff"/>
  <text x="315" y="209" text-anchor="middle" font-size="10" fill="#055160">コミット待ち</text>
  <rect x="240" y="96" width="150" height="130" rx="14" fill="none" stroke="#e16f24" stroke-width="4" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.28;0.37;0.42;1" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- arrow + git commit -->
  <line x1="390" y1="161" x2="440" y2="161" stroke="#0969da" stroke-width="3" marker-end="url(#afArr)"/>
  <rect x="378" y="122" width="80" height="26" rx="8" fill="#ddf4ff" stroke="#0969da"/>
  <text x="418" y="140" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0969da">git commit</text>
  <rect x="378" y="122" width="80" height="26" rx="8" fill="#0969da" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.375;0.39;0.5;0.54;1" dur="8s" repeatCount="indefinite"/>
  </rect>
  <text x="418" y="140" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#fff" opacity="0">git commit
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.375;0.39;0.5;0.54;1" dur="8s" repeatCount="indefinite"/>
  </text>

  <!-- ===== Local Repository ===== -->
  <rect x="450" y="96" width="150" height="130" rx="14" fill="#d1e7dd" stroke="#198754" stroke-width="2" filter="url(#afShadow)"/>
  <text x="525" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f5132">ローカルリポ</text>
  <text x="525" y="148" text-anchor="middle" font-size="10.5" fill="#0f5132">Local Repository</text>
  <rect x="470" y="162" width="110" height="24" rx="6" fill="#fff"/>
  <text x="525" y="179" text-anchor="middle" font-size="10" fill="#0f5132">履歴として記録</text>
  <rect x="470" y="192" width="110" height="24" rx="6" fill="#fff"/>
  <text x="525" y="209" text-anchor="middle" font-size="10" fill="#0f5132">まだ PC の中</text>
  <rect x="450" y="96" width="150" height="130" rx="14" fill="none" stroke="#e16f24" stroke-width="4" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.53;0.62;0.67;1" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- arrow + git push -->
  <line x1="600" y1="161" x2="650" y2="161" stroke="#0969da" stroke-width="3" marker-end="url(#afArr)"/>
  <rect x="590" y="122" width="76" height="26" rx="8" fill="#ddf4ff" stroke="#0969da"/>
  <text x="628" y="140" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0969da">git push</text>
  <rect x="590" y="122" width="76" height="26" rx="8" fill="#0969da" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.625;0.64;0.75;0.79;1" dur="8s" repeatCount="indefinite"/>
  </rect>
  <text x="628" y="140" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#fff" opacity="0">git push
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.625;0.64;0.75;0.79;1" dur="8s" repeatCount="indefinite"/>
  </text>

  <!-- ===== Remote ===== -->
  <rect x="660" y="96" width="120" height="130" rx="14" fill="#f3e8ff" stroke="#8250df" stroke-width="2" filter="url(#afShadow)"/>
  <text x="720" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#6e40c9">リモート</text>
  <text x="720" y="148" text-anchor="middle" font-size="10.5" fill="#6e40c9">GitHub 上</text>
  <rect x="675" y="162" width="90" height="24" rx="6" fill="#fff"/>
  <text x="720" y="179" text-anchor="middle" font-size="10" fill="#6e40c9">チームで</text>
  <rect x="675" y="192" width="90" height="24" rx="6" fill="#fff"/>
  <text x="720" y="209" text-anchor="middle" font-size="10" fill="#6e40c9">共有！</text>
  <rect x="660" y="96" width="120" height="130" rx="14" fill="none" stroke="#e16f24" stroke-width="4" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.75;0.78;1" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- ===== Traveling file token ===== -->
  <g>
    <animate attributeName="opacity" values="0;1;1;1;0" keyTimes="0;0.04;0.5;0.94;1" dur="8s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="105,0; 105,0; 315,0; 315,0; 525,0; 525,0; 720,0; 720,0"
        keyTimes="0; 0.125; 0.25; 0.375; 0.5; 0.625; 0.75; 1"
        calcMode="spline"
        keySplines="0 0 1 1; .4 0 .2 1; 0 0 1 1; .4 0 .2 1; 0 0 1 1; .4 0 .2 1; 0 0 1 1"
        dur="8s" repeatCount="indefinite"/>
      <circle cx="0" cy="258" r="17" fill="#ffffff" stroke="#e16f24" stroke-width="2.5" filter="url(#afShadow)"/>
      <text x="0" y="264" text-anchor="middle" font-size="15">📄</text>
    </g>
  </g>
  <text x="400" y="298" text-anchor="middle" font-size="11" fill="#8b949e">↑ あなたの変更（ファイル）が移動していきます</text>

  <!-- ===== Bottom summary ===== -->
  <rect x="100" y="318" width="600" height="52" rx="12" fill="#fff" stroke="#d0d7de"/>
  <text x="400" y="349" text-anchor="middle" font-size="13" fill="#24292e">
    <tspan font-weight="bold" fill="#f0ad4e">編集</tspan>
    <tspan fill="#6e7781"> → </tspan>
    <tspan font-weight="bold" fill="#0dcaf0">git add</tspan>
    <tspan fill="#6e7781"> → </tspan>
    <tspan font-weight="bold" fill="#198754">git commit</tspan>
    <tspan fill="#6e7781"> → </tspan>
    <tspan font-weight="bold" fill="#8250df">git push</tspan>
    <tspan fill="#6e7781"> が基本の流れ！</tspan>
  </text>
</svg>
