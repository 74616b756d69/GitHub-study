<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Hiragino Sans', sans-serif">
  <defs>
    <filter id="shRv" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
    <marker id="arrRv" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6e7781"/>
    </marker>
  </defs>

  <rect width="800" height="420" rx="16" fill="#f6f8fa"/>
  <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#24292e">コードレビューの流れ</text>

  <!-- Person A (Author) -->
  <circle cx="120" cy="100" r="30" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
  <text x="120" y="95" text-anchor="middle" font-size="20" fill="#0969da">A</text>
  <text x="120" y="112" text-anchor="middle" font-size="8" fill="#0969da">さん</text>
  <text x="120" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#0969da">作成者</text>
  <text x="120" y="167" text-anchor="middle" font-size="10" fill="#57606a">（PR を出す人）</text>

  <!-- Person B (Reviewer) -->
  <circle cx="680" cy="100" r="30" fill="#f3e8ff" stroke="#8250df" stroke-width="2"/>
  <text x="680" y="95" text-anchor="middle" font-size="20" fill="#8250df">B</text>
  <text x="680" y="112" text-anchor="middle" font-size="8" fill="#8250df">さん</text>
  <text x="680" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#8250df">レビュアー</text>
  <text x="680" y="167" text-anchor="middle" font-size="10" fill="#57606a">（確認する人）</text>

  <!-- Step 1: Submit PR -->
  <rect x="200" y="190" width="180" height="50" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5" filter="url(#shRv)"/>
  <text x="290" y="213" text-anchor="middle" font-size="11" font-weight="bold" fill="#0969da">1. PR を作成</text>
  <text x="290" y="230" text-anchor="middle" font-size="10" fill="#0550ae">「レビューお願いします！」</text>

  <!-- Arrow to reviewer -->
  <line x1="380" y1="215" x2="420" y2="215" stroke="#6e7781" stroke-width="2" marker-end="url(#arrRv)"/>

  <!-- Step 2: Review -->
  <rect x="420" y="190" width="180" height="50" rx="10" fill="#f3e8ff" stroke="#8250df" stroke-width="1.5" filter="url(#shRv)"/>
  <text x="510" y="213" text-anchor="middle" font-size="11" font-weight="bold" fill="#8250df">2. コードを確認</text>
  <text x="510" y="230" text-anchor="middle" font-size="10" fill="#6e40c9">Files changed を見る</text>

  <!-- Step 3: Comment (Reviewer → Author) -->
  <rect x="420" y="265" width="180" height="50" rx="10" fill="#fff3cd" stroke="#f0ad4e" stroke-width="1.5" filter="url(#shRv)"/>
  <text x="510" y="288" text-anchor="middle" font-size="11" font-weight="bold" fill="#664d03">3. コメント</text>
  <text x="510" y="305" text-anchor="middle" font-size="10" fill="#664d03">「ここ直すともっと良い！」</text>

  <!-- Arrow back to author -->
  <line x1="420" y1="290" x2="380" y2="290" stroke="#6e7781" stroke-width="2" marker-end="url(#arrRv)"/>

  <!-- Step 4: Fix (Author) -->
  <rect x="200" y="265" width="180" height="50" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5" filter="url(#shRv)"/>
  <text x="290" y="288" text-anchor="middle" font-size="11" font-weight="bold" fill="#0969da">4. 修正して再 push</text>
  <text x="290" y="305" text-anchor="middle" font-size="10" fill="#0550ae">指摘を反映する</text>

  <!-- Loop arrow (optional back to review) -->
  <path d="M 380 280 C 400 260, 420 260, 420 280" stroke="#e16f24" stroke-width="1.5" fill="none" stroke-dasharray="4,2"/>
  <text x="400" y="258" text-anchor="middle" font-size="8" fill="#e16f24">繰り返し</text>

  <!-- Step 5: Approve -->
  <rect x="420" y="340" width="180" height="50" rx="10" fill="#d1e7dd" stroke="#1a7f37" stroke-width="1.5" filter="url(#shRv)"/>
  <text x="510" y="363" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a7f37">5. Approve（承認）</text>
  <text x="510" y="380" text-anchor="middle" font-size="10" fill="#0f5132">「LGTM！問題なし！」</text>

  <!-- Arrow down -->
  <line x1="510" y1="315" x2="510" y2="338" stroke="#6e7781" stroke-width="2" marker-end="url(#arrRv)"/>

  <!-- Step 6: Merge -->
  <rect x="630" y="340" width="130" height="50" rx="25" fill="#1a7f37" filter="url(#shRv)"/>
  <text x="695" y="363" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">6. Merge!</text>
  <text x="695" y="380" text-anchor="middle" font-size="10" fill="#d1e7dd">main に統合</text>

  <!-- Arrow to merge -->
  <line x1="600" y1="365" x2="628" y2="365" stroke="#1a7f37" stroke-width="2" marker-end="url(#arrRv)"/>

  <!-- LGTM note -->
  <rect x="40" y="340" width="150" height="50" rx="8" fill="#fff" stroke="#d0d7de" stroke-width="1"/>
  <text x="115" y="360" text-anchor="middle" font-size="10" font-weight="bold" fill="#24292e">LGTM とは？</text>
  <text x="115" y="378" text-anchor="middle" font-size="9" fill="#57606a">Looks Good To Me</text>
  <text x="115" y="390" text-anchor="middle" font-size="9" fill="#57606a">（いいと思います！）</text>
</svg>